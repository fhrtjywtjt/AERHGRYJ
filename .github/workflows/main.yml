  # ==========================================
  # STAGE 4: MUSIC, EDITING, IG & YT UPLOAD
  # ==========================================
  stage4-post-process:
    needs: stage3-videos
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install System Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg zip
        pip install playwright transformers torch scipy requests instagrapi google-api-python-client google-auth-oauthlib google-auth-httplib2
        
    - uses: actions/download-artifact@v4
      with:
        name: base-assets
        
    - uses: actions/download-artifact@v4
      with:
        path: generated_videos/
        pattern: video_machine_*
        merge-multiple: true

    - name: Generate Background Music
      run: python generate_music.py
        
    - name: Final Video Editing (Text Overlay + BGM)
      run: python process_videos.py
      
    - name: Upload to Instagram (Skip if fails) 🚀
      continue-on-error: true  # 🔴 IG fail ho jaye toh bhi aage badhega
      env:
        IG_COOKIES_BASE64: ${{ secrets.IG_COOKIES_BASE64 }}
      run: python upload_instagram.py

    - name: Upload to YouTube Shorts 🔴
      env:
        YT_OAUTH_JSON: ${{ secrets.YT_OAUTH_JSON }} # YouTube Auth secret
      run: python upload_youtube.py

    - name: Create Backup ZIP
      run: zip -r Final_Agency_Video.zip final_output/Final_Agency_Reel.mp4 metadata.txt
      
    - uses: actions/upload-artifact@v4
      with:
        name: Final_Ready_Reel
        path: Final_Agency_Video.zip
