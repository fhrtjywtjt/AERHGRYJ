name: 🚀 15-Sec Viral Agency Automator

on:
  schedule:
    - cron: '30 03 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg
        pip install openai requests playwright urllib3 instagrapi google-api-python-client google-auth-oauthlib google-auth-httplib2 transformers torch scipy
        playwright install chromium
        playwright install-deps chromium
        
    - name: 🧠 Generate Viral Concept
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: python ig_marketer_brain.py
      
    - name: Format Prompt for Image Generator
      run: |
        # Bing bot requires prompts.txt format
        grep "IMAGE_PROMPT:" reel_data.txt | sed 's/IMAGE_PROMPT: //' > prompts.txt
        # Extract Metadata for Uploads
        grep -E "IG_CAPTION:|IG_TAGS:|YT_TITLE:|YT_DESC:|YT_TAGS:" reel_data.txt > metadata.txt

    - name: 🖼️ Generate Cinematic Image
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python generate_image.py 1
        
    - name: 🎵 Generate BGM
      run: |
        echo "deep cinematic bass pulse" > music_prompt.txt
        python generate_music.py
        
    - name: 🎬 Create 15-Sec Reel
      run: python make_reel.py
      
    - name: 📱 Upload to Instagram
      continue-on-error: true
      env:
        IG_COOKIES_BASE64: ${{ secrets.IG_COOKIES_BASE64 }}
      run: python upload_instagram.py

    - name: 🔴 Upload to YouTube Shorts
      continue-on-error: true
      env:
        YT_OAUTH_JSON: ${{ secrets.YT_OAUTH_JSON }}
      run: python upload_youtube.py
