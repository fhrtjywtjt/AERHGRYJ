name: 🚀 15-Sec Viral Agency Automator

on:
  schedule:
    - cron: '30 03 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg zip
        pip install openai requests playwright urllib3 instagrapi google-api-python-client google-auth-oauthlib google-auth-httplib2 transformers torch scipy
        playwright install chromium
        playwright install-deps chromium
        
    - name: 🧠 Generate Viral Concept
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: python ig_marketer_brain.py
      
    - name: Format Prompts & Metadata
      run: |
        grep "IMAGE_PROMPT:" reel_data.txt | sed 's/IMAGE_PROMPT: //' > prompts.txt
        grep -E "IG_CAPTION:|IG_TAGS:|YT_TITLE:|YT_DESC:|YT_TAGS:|MUSIC:" reel_data.txt > metadata.txt
        grep "MUSIC:" reel_data.txt | sed 's/MUSIC: //' > music_prompt.txt

    - name: 🖼️ Generate Image (Bing DALL-E)
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python generate_image.py 1
        
    - name: 🎵 Generate BGM (Local AI)
      run: python generate_music.py
        
    - name: 🎬 Create 15-Sec Cinematic Reel
      run: python make_reel.py
      
    - name: 📱 Upload to Instagram
      continue-on-error: true
      env:
        IG_COOKIES_BASE64: ${{ secrets.IG_COOKIES_BASE64 }}
      run: python upload_instagram.py

    - name: 🔴 Upload to YouTube Shorts
      continue-on-error: true
      env:
        YT_OAUTH_JSON: ${{ secrets.YT_OAUTH_JSON }}
      run: python upload_youtube.py
      
    - name: Create Backup ZIP
      run: zip -r Final_Agency_Reel.zip final_output/Final_Agency_Reel.mp4 metadata.txt
      
    - uses: actions/upload-artifact@v4
      with:
        name: Final_Ready_Reel
        path: Final_Agency_Reel.zip
