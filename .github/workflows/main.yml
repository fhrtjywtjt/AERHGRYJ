name: Instagram & YouTube Agency Automator

on:
  schedule:
    - cron: '30 03 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage1-brain:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: pip install openai
        
    - name: Run Agency Brain (Generate Script)
      run: python ig_marketer_brain.py
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        
    - uses: actions/upload-artifact@v4
      with:
        name: base-assets
        path: |
          prompts.txt
          metadata.txt
          music_prompt.txt
          
    - id: set-matrix
      run: |
        count=$(grep -c '^' prompts.txt || echo 0)
        if [ "$count" -eq 0 ]; then exit 1; fi
        matrix_json=$(python3 -c "import json; print(json.dumps(list(range(1, $count + 1))))")
        echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  stage2-images:
    needs: stage1-brain
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        machine_id: ${{ fromJson(needs.stage1-brain.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Playwright & Requests
      run: |
        pip install requests playwright urllib3
        playwright install chromium
        playwright install-deps chromium
        
    - uses: actions/download-artifact@v4
      with:
        name: base-assets
        
    - name: Generate Image
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python generate_image.py ${{ matrix.machine_id }}
      
    - uses: actions/upload-artifact@v4
      with:
        name: image_machine_${{ matrix.machine_id }}
        path: scene_images/

  stage3-videos:
    needs: [stage1-brain, stage2-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        machine_id: ${{ fromJson(needs.stage1-brain.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Playwright
      run: |
        pip install requests playwright
        playwright install chromium
        playwright install-deps chromium
        
    - uses: actions/download-artifact@v4
      with:
        name: base-assets
        
    - uses: actions/download-artifact@v4
      with:
        name: image_machine_${{ matrix.machine_id }}
        path: scene_images/
        
    - name: Generate Video (Upsampler AI)
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python generate_video.py ${{ matrix.machine_id }}
      
    - uses: actions/upload-artifact@v4
      with:
        name: video_machine_${{ matrix.machine_id }}
        path: generated_videos/

  stage4-post-process:
    needs: stage3-videos
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install System Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg zip
        pip install playwright transformers torch scipy requests instagrapi google-api-python-client google-auth-oauthlib google-auth-httplib2
        
    - uses: actions/download-artifact@v4
      with:
        name: base-assets
        
    - uses: actions/download-artifact@v4
      with:
        path: generated_videos/
        pattern: video_machine_*
        merge-multiple: true

    - name: Generate Background Music (Local AI)
      run: python generate_music.py
        
    - name: Final Video Editing
      run: python process_videos.py
      
    - name: Upload to Instagram via Instagrapi 🚀
      continue-on-error: true
      env:
        IG_COOKIES_BASE64: ${{ secrets.IG_COOKIES_BASE64 }}
      run: python upload_instagram.py

    - name: Upload to YouTube Shorts 🔴
      continue-on-error: true
      env:
        YT_OAUTH_JSON: ${{ secrets.YT_OAUTH_JSON }}
      run: python upload_youtube.py

    - name: Create Downloadable Backup ZIP
      run: zip -r Final_Agency_Video.zip final_output/Final_Agency_Reel.mp4 metadata.txt
      
    - uses: actions/upload-artifact@v4
      with:
        name: Final_Ready_Reel
        path: Final_Agency_Video.zip
